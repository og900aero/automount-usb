# /etc/usb-automount.conf — root tulajdonú legyen, mode 0644
# Minden sor opcionális; a kikommentezett érték az alapértelmezett.

# Kinek a nevére csatoljon. Üresen: a seat0 aktív sessionjének felhasználója
# (startx/X11 és Wayland compositor alatt is működik, ha a login pam_systemd-n megy át).
#MOUNT_USER=""

# Mountpont: $MOUNT_BASE/<user>/<címke>. Archon a udisks2 /run/media-t használ.
#MOUNT_BASE=/media

# noexec: a pendrive-ról nem lehet programot/szkriptet közvetlenül futtatni.
#NOEXEC=yes

# Asztali értesítés (notify-send a felhasználó D-Bus session buszán).
#NOTIFY=yes

# Engedélyezett fájlrendszerek.
#ALLOWED_FS="vfat exfat ntfs ext2 ext3 ext4 btrfs xfs f2fs iso9660 udf"
